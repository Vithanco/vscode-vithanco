# Builds this extension against the VGraph engine. The sources import the engine's glue
# from ../../website/Package, so the extension is checked out inside VGraph, as it is on
# the maintainer's machine. Nothing is published from here: `just release-engine` in
# VGraph starts the dispatch below, and `just publish-plugins` releases.
# Actions are pinned to a full commit SHA, as in VGraph.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      vgraph_ref:
        description: VGraph tag or branch to build against (empty means its latest v* tag, else main)
        required: false
      release_version:
        description: Open a bump PR to this version once the build passes (empty means none)
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build against the VGraph engine
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - name: Choose the VGraph ref
        id: vgraph
        env:
          VGRAPH_REF: ${{ inputs.vgraph_ref }}
        run: |
          if [ -n "$RELEASE_VERSION" ] && ! [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release_version must be plain semver, got '$RELEASE_VERSION'"
            exit 1
          fi
          if [ -z "$VGRAPH_REF" ]; then
            VGRAPH_REF=$(git ls-remote --tags --refs --sort=-v:refname https://github.com/Vithanco/VGraph.git 'v*' \
              | head -1 | sed 's|.*refs/tags/||')
          fi
          echo "ref=${VGRAPH_REF:-main}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Vithanco/VGraph
          ref: ${{ steps.vgraph.outputs.ref }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: vscode-vithanco
          persist-credentials: false
      # A build can pass while calling an export the engine no longer has.
      - name: Every engine call still exists
        run: ./scripts/check-plugin-api.sh
      - name: Identify the engine
        id: engine
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore the engine
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/Package
          key: engine-${{ steps.engine.outputs.sha }}
      # The container comes from the ref being built, so a Swift bump there needs no change here.
      - name: Build the engine
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm -v "$PWD:/work" -w /work "swift:$(tr -d '[:space:]' < .swift-version)-noble" ./scripts/ci-engine.sh
          sudo chown -R "$(id -u):$(id -g)" .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build and package the extension
        working-directory: vscode-vithanco
        run: |
          npm ci
          if [ -n "$RELEASE_VERSION" ]; then npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version; fi
          npm test
          npm run typecheck
          npm run build
          npm run package
      - name: The bundle holds an optimized engine
        run: ./scripts/check-wasm-optimized.sh vscode-vithanco/VGraphWasm.wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-vithanco
          if-no-files-found: error
          path: vscode-vithanco/*.vsix

  bump-pr:
    # Only this job can write, and it installs and runs no dependencies.
    # GitHub needs Settings > Actions > General > "Allow GitHub Actions to create and
    # approve pull requests". A PR opened with this token starts no workflow; the
    # build job above has already checked the same version.
    name: Open the bump PR
    needs: build
    if: inputs.release_version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ inputs.release_version }}
      VGRAPH_REF: ${{ inputs.vgraph_ref }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Commit the bump and open the PR
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          ./scripts/open-bump-pr.sh "$VERSION" \
            "Bumps to $VERSION for the engine from VGraph $VGRAPH_REF. Built, typechecked and packaged in $RUN_URL. After merging, run \`just plugins-pull\`, \`just release\` and \`just publish-plugins\` in VGraph." \
            package.json package-lock.json
